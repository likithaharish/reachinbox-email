services:
  - type: web
    name: reachinbox-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5177"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: START_WORKER_IN_PROCESS
        value: "true"
      - key: BULLMQ_QUEUE_NAME
        value: reachinbox-email-scheduler
      - key: BULLMQ_WORKER_CONCURRENCY
        value: "3"
      - key: ETHEREAL_SMTP_HOST
        sync: false
      - key: ETHEREAL_SMTP_PORT
        sync: false
      - key: ETHEREAL_SMTP_USER
        sync: false
      - key: ETHEREAL_SMTP_PASS
        sync: false
      - key: ETHEREAL_SMTP_FROM_EMAIL
        sync: false
      - key: DEFAULT_SENDER_KEY
        value: default
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
